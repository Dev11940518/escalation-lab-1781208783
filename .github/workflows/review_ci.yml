name: review_ci
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
  issues: write
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Print canary line
        run: |
          echo "CANARY_RAN run=${{ github.run_id }} actor=${{ github.actor }} triggering_actor=${{ github.triggering_actor }} event=${{ github.event_name }} pr=${{ github.event.pull_request.number }} review_state=${{ github.event.review.state }} review_user=${{ github.event.review.user.login }}"
      - name: Print secret presence (boolean only)
        run: |
          echo "SECRET_VISIBLE=${{ secrets.CANARY_SECRET != '' }}"
      - name: Probe GITHUB_TOKEN write capability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          label_name="review-ci-write-probe-${{ github.run_id }}"
          status=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/labels \
            -d "{\"name\":\"$label_name\",\"color\":\"00ff00\"}")
          echo "TOKEN_WRITABLE=$status"
          head -c 200 /tmp/resp.json || true
          echo
