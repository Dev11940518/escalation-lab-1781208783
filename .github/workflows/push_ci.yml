name: push_ci
on:
  push:
    branches:
      - 'attack/**'
permissions:
  contents: read
  issues: write
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Print canary line
        run: |
          echo "CANARY_RAN event=push run=${{ github.run_id }} actor=${{ github.actor }} ref=${{ github.ref }}"
      - name: Print secret presence (boolean only)
        run: |
          echo "SECRET_VISIBLE=${{ secrets.CANARY_SECRET != '' }}"
      - name: Probe GITHUB_TOKEN write capability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          label_name="push-write-probe-${{ github.run_id }}"
          status=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/labels \
            -d "{\"name\":\"$label_name\",\"color\":\"00ff00\"}")
          echo "TOKEN_WRITABLE=$status"
